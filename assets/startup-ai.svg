<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111d" />
      <stop offset="100%" stop-color="#070912" />
    </linearGradient>
    <linearGradient id="gradPurpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#62e6ff" />
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="aiGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgAI)"/>

  <!-- Neural Network Mesh in Background -->
  <g opacity="0.12" stroke="#a855f7" stroke-width="1">
    <line x1="100" y1="80" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="350" y2="100"/>
    <line x1="350" y1="100" x2="480" y2="180"/>
    <line x1="480" y1="180" x2="620" y2="120"/>
    <line x1="620" y1="120" x2="720" y2="200"/>
    <line x1="220" y1="160" x2="260" y2="340"/>
    <line x1="480" y1="180" x2="420" y2="380"/>
    <line x1="620" y1="120" x2="680" y2="360"/>
    <circle cx="100" cy="80" r="4" fill="#62e6ff"/>
    <circle cx="220" cy="160" r="5" fill="#a855f7"/>
    <circle cx="350" cy="100" r="4" fill="#62e6ff"/>
    <circle cx="480" cy="180" r="6" fill="#a855f7"/>
    <circle cx="620" cy="120" r="4" fill="#62e6ff"/>
    <circle cx="720" cy="200" r="5" fill="#a855f7"/>
    <circle cx="260" cy="340" r="4" fill="#62e6ff"/>
    <circle cx="420" cy="380" r="5" fill="#a855f7"/>
  </g>

  <!-- Chat Window Container -->
  <rect x="60" y="45" width="680" height="430" rx="18" fill="#111624" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#aiGlow)"/>

  <!-- Top Navigation Header -->
  <rect x="60" y="45" width="680" height="52" rx="18" fill="#161e30"/>
  <rect x="60" y="80" width="680" height="17" fill="#161e30"/>
  <line x1="60" y1="97" x2="740" y2="97" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <circle cx="88" cy="71" r="5" fill="#ff5f56"/>
  <circle cx="106" cy="71" r="5" fill="#ffbd2e"/>
  <circle cx="124" cy="71" r="5" fill="#27c93f"/>

  <!-- Bot Avatar in Header -->
  <circle cx="165" cy="71" r="14" fill="url(#gradPurpleCyan)"/>
  <text x="165" y="76" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">AI</text>
  <text x="188" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Startup AI Agent</text>
  <text x="188" y="82" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="9">RAG · LangChain · ChromaDB Vector Engine</text>

  <rect x="625" y="60" width="95" height="22" rx="11" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="0.8"/>
  <text x="672" y="74" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">⚡ RAG ACTIVE</text>

  <!-- Chat History Conversation -->
  <!-- User Message Bubble -->
  <g transform="translate(320, 120)">
    <rect width="380" height="52" rx="14" fill="url(#userBubble)"/>
    <text x="18" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">How does our customer onboarding funnel perform,</text>
    <text x="18" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">and which knowledge base documents cite this?</text>
  </g>

  <!-- AI Retrieval Stage Badge -->
  <g transform="translate(100, 185)">
    <rect width="360" height="26" rx="6" fill="rgba(98,230,255,0.06)" stroke="rgba(98,230,255,0.2)"/>
    <text x="12" y="17" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="10">🔍 Vector Search: 3 matching chunks from ChromaDB (Score: 0.94)</text>
  </g>

  <!-- AI Assistant Response Bubble -->
  <g transform="translate(100, 225)">
    <rect width="520" height="155" rx="14" fill="#172133" stroke="rgba(255,255,255,0.08)"/>
    
    <text x="20" y="30" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">STARTUP AI AGENT RESPONSE</text>
    
    <text x="20" y="55" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Based on Q3 Product Analytics &amp; User Flow Manual:</text>
    <text x="20" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">1. Completion rate increased by <tspan fill="#63e6a2" font-weight="700">34.2%</tspan> following interactive guide rollouts.</text>
    <text x="20" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">2. Average drop-off time was reduced from 4.8 mins down to 1.2 mins.</text>
    <text x="20" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">3. Automated ticket resolution reached 78% via RAG assistant triage.</text>

    <!-- Source Chips -->
    <rect x="20" y="130" width="130" height="16" rx="4" fill="rgba(168,85,247,0.15)"/>
    <text x="28" y="142" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="9">📄 source: q3_funnel.pdf</text>
    <rect x="160" y="130" width="145" height="16" rx="4" fill="rgba(98,230,255,0.12)"/>
    <text x="168" y="142" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="9">📄 source: user_manual.md</text>
  </g>

  <!-- Chat Input Bar -->
  <g transform="translate(100, 400)">
    <rect width="600" height="48" rx="24" fill="#0c121d" stroke="rgba(255,255,255,0.15)"/>
    <text x="25" y="30" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Ask anything about company documentation, APIs or analytics...</text>
    
    <!-- Send Button -->
    <circle cx="572" cy="24" r="16" fill="url(#gradPurpleCyan)"/>
    <path d="M 567 24 L 575 19 L 575 29 Z" fill="#ffffff"/>
  </g>
</svg>


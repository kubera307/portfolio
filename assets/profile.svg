<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e6ff" />
      <stop offset="100%" stop-color="#8b7cff" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af94" />
      <stop offset="100%" stop-color="#b08b6f" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#0c121d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="30" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#62e6ff" stroke-width="1">
    <path d="M 0 60 H 400 M 0 120 H 400 M 0 180 H 400 M 0 240 H 400 M 0 300 H 400 M 0 360 H 400 M 0 420 H 400"/>
    <path d="M 60 0 V 480 M 120 0 V 480 M 180 0 V 480 M 240 0 V 480 M 300 0 V 480 M 360 0 V 480"/>
  </g>

  <!-- Cyber Halo Glow Behind Head -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#cyberNeon)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="url(#cyberNeon)" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Code Elements in Background -->
  <text x="35" y="80" fill="#62e6ff" font-family="'Courier New', monospace" font-size="12" opacity="0.4">&lt;developer&gt;</text>
  <text x="270" y="80" fill="#8b7cff" font-family="'Courier New', monospace" font-size="12" opacity="0.4">&lt;ai_ml/&gt;</text>
  <text x="35" y="420" fill="#63e6a2" font-family="'Courier New', monospace" font-size="11" opacity="0.3">def build_future():</text>
  <text x="260" y="420" fill="#62e6ff" font-family="'Courier New', monospace" font-size="11" opacity="0.3">return impact</text>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders & Hoodie -->
  <path d="M 90 480 C 95 380, 130 330, 200 330 C 270 330, 305 380, 310 480 Z" fill="url(#clothGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Hoodie Collar / Inner -->
  <path d="M 155 330 Q 200 380 245 330 Q 200 420 155 330" fill="#0f1724" stroke="url(#cyberNeon)" stroke-width="1.5" opacity="0.7"/>

  <!-- Neck -->
  <path d="M 175 270 L 175 320 Q 200 335 225 320 L 225 270 Z" fill="url(#skinGrad)" opacity="0.9"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="205" rx="55" ry="68" fill="url(#skinGrad)"/>

  <!-- Hair / Modern Cut -->
  <path d="M 140 195 C 138 135, 170 120, 205 120 C 245 120, 265 140, 260 190 C 255 170, 235 150, 200 150 C 165 150, 145 170, 140 195 Z" fill="#181e2b"/>
  <path d="M 155 145 Q 185 110 230 125 Q 260 135 255 160 Q 230 135 185 135 Q 165 135 155 145" fill="#252f44"/>

  <!-- Glasses / Modern Cyber Frame -->
  <rect x="156" y="188" width="36" height="22" rx="6" fill="rgba(98,230,255,0.08)" stroke="#62e6ff" stroke-width="2"/>
  <rect x="208" y="188" width="36" height="22" rx="6" fill="rgba(98,230,255,0.08)" stroke="#62e6ff" stroke-width="2"/>
  <line x1="192" y1="199" x2="208" y2="199" stroke="#62e6ff" stroke-width="2"/>
  <line x1="147" y1="197" x2="156" y2="199" stroke="#62e6ff" stroke-width="1.5"/>
  <line x1="244" y1="199" x2="253" y2="197" stroke="#62e6ff" stroke-width="1.5"/>

  <!-- Modern Smile / Expression -->
  <path d="M 188 244 Q 200 252 212 244" fill="none" stroke="#7a5843" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monogram Badge floating bottom center -->
  <g transform="translate(145, 290)">
    <rect width="110" height="32" rx="16" fill="rgba(7, 10, 16, 0.85)" stroke="url(#cyberNeon)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="55" y="21" fill="#f4f7fb" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KUBERA B</text>
  </g>
</svg>


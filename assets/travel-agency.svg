<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTravel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1420" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="travelGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgTravel)"/>

  <!-- Travel Web Portal Mockup -->
  <rect x="50" y="45" width="700" height="430" rx="16" fill="#0f1726" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#travelGlow)"/>

  <!-- Browser Header -->
  <rect x="50" y="45" width="700" height="48" rx="16" fill="#141f33"/>
  <rect x="50" y="78" width="700" height="15" fill="#141f33"/>
  <line x1="50" y1="93" x2="750" y2="93" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <circle cx="75" cy="69" r="5" fill="#ff5f56"/>
  <circle cx="93" cy="69" r="5" fill="#ffbd2e"/>
  <circle cx="111" cy="69" r="5" fill="#27c93f"/>

  <!-- Nav Links Mockup -->
  <text x="150" y="73" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">VOYAGE · EXPLORE</text>
  <text x="440" y="72" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Destinations</text>
  <text x="520" y="72" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Tour Packages</text>
  <text x="610" y="72" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Bookings</text>
  
  <rect x="675" y="58" width="60" height="22" rx="11" fill="#62e6ff"/>
  <text x="705" y="72" fill="#070a10" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">LOGIN</text>

  <!-- Hero Banner inside Mockup -->
  <g transform="translate(75, 110)">
    <rect width="650" height="135" rx="12" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.08)"/>
    
    <text x="30" y="40" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">DISCOVER YOUR NEXT ESCAPE</text>
    <text x="30" y="72" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">Curated Journeys Across The World</text>
    <text x="30" y="96" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Automated itineraries, instant hotel bookings &amp; flexible travel packages.</text>

    <!-- Search Bar Filter Strip -->
    <g transform="translate(30, 112)">
      <rect width="590" height="42" rx="10" fill="#0c1320" stroke="rgba(98,230,255,0.25)" stroke-width="1.2"/>
      <text x="25" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10">📍 Destination: Goa / Munnar</text>
      <line x1="180" y1="10" x2="180" y2="32" stroke="rgba(255,255,255,0.1)"/>
      <text x="200" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10">📅 Date: Nov 14 - 18</text>
      <line x1="330" y1="10" x2="330" y2="32" stroke="rgba(255,255,255,0.1)"/>
      <text x="350" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10">👥 Guests: 2 Adults</text>
      <rect x="495" y="6" width="85" height="30" rx="7" fill="url(#sunsetGrad)"/>
      <text x="537" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Find Tours ↗</text>
    </g>
  </g>

  <!-- Destination Cards Grid -->
  <g transform="translate(75, 290)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="200" height="160" rx="12" fill="#131c2e" stroke="rgba(255,255,255,0.08)"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#sunsetGrad)"/>
    <rect x="0" y="75" width="200" height="15" fill="url(#sunsetGrad)"/>
    <text x="15" y="112" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Goa Coastal Bliss</text>
    <text x="15" y="130" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">4 Days · 3 Nights</text>
    <text x="185" y="145" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end">₹12,499</text>

    <!-- Card 2 -->
    <rect x="225" y="0" width="200" height="160" rx="12" fill="#131c2e" stroke="rgba(255,255,255,0.08)"/>
    <rect x="225" y="0" width="200" height="90" rx="12" fill="url(#oceanGrad)"/>
    <rect x="225" y="75" width="200" height="15" fill="url(#oceanGrad)"/>
    <text x="240" y="112" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Munnar Tea Highlands</text>
    <text x="240" y="130" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">5 Days · 4 Nights</text>
    <text x="410" y="145" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end">₹15,999</text>

    <!-- Card 3 -->
    <rect x="450" y="0" width="200" height="160" rx="12" fill="#131c2e" stroke="rgba(255,255,255,0.08)"/>
    <rect x="450" y="0" width="200" height="90" rx="12" fill="#2563eb"/>
    <rect x="450" y="75" width="200" height="15" fill="#2563eb"/>
    <text x="465" y="112" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Coorg Misty Haven</text>
    <text x="465" y="130" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">3 Days · 2 Nights</text>
    <text x="635" y="145" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end">₹9,999</text>
  </g>
</svg>


    <text x="16" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">TOTAL ALLOCATED</text>
    <text x="16" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700">48 Duties</text>
    <rect x="110" y="15" width="30" height="18" rx="4" fill="rgba(98,230,255,0.1)"/>

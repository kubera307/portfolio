  <rect x="670" y="58" width="60" height="18" rx="9" fill="rgba(99,230,162,0.15)" stroke="#63e6a2" stroke-width="0.8"/>
  <text x="700" y="71" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>


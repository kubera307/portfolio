    <text x="440" y="111" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">✓ Verified</text>

    <!-- Row 3 -->
    <line x1="0" y1="130" x2="495" y2="130" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="157" fill="#f4f7fb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Prof. Swathi B. (AIML)</text>
    <text x="160" y="157" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">3rd Sem AIML</text>
    <text x="245" y="157" fill="#f4f7fb" font-family="'Segoe UI', sans-serif" font-size="11">Hall B-102</text>
    <rect x="345" y="144" width="75" height="20" rx="6" fill="rgba(98,230,255,0.12)"/>
    <text x="382" y="158" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Invigilation</text>
    <text x="440" y="157" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Upcoming</text>

    <!-- Row 4 -->
    <line x1="0" y1="176" x2="495" y2="176" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="203" fill="#f4f7fb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Prof. Chethan M.</text>
    <text x="160" y="203" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">7th Sem</text>
    <text x="245" y="203" fill="#f4f7fb" font-family="'Segoe UI', sans-serif" font-size="11">Lab 3 (CIE)</text>
    <rect x="345" y="190" width="75" height="20" rx="6" fill="rgba(98,230,255,0.12)"/>
    <text x="382" y="204" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Invigilation</text>
    <text x="440" y="203" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Upcoming</text>

    <!-- Automated Notification Banner bottom -->
    <rect x="15" y="222" width="465" height="28" rx="6" fill="rgba(98,230,255,0.06)" stroke="rgba(98,230,255,0.2)"/>
    <text x="30" y="240" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">⚡ Engine Check: 0 Timetable Clashes · 60-min Pre/Post Lecture Buffer Preserved</text>

    <text x="382" y="66" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Invigilation</text>
    <text x="440" y="65" fill="#63e6a2" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">✓ Done</text>


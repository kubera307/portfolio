<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e6ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadowBox">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" fill="url(#bgSD)"/>

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#62e6ff" stroke-width="1">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800 M 0 400 H 800 M 0 450 H 800"/>
    <path d="M 50 0 V 520 M 100 0 V 520 M 150 0 V 520 M 200 0 V 520 M 250 0 V 520 M 300 0 V 520 M 350 0 V 520 M 400 0 V 520 M 450 0 V 520 M 500 0 V 520 M 550 0 V 520 M 600 0 V 520 M 650 0 V 520 M 700 0 V 520 M 750 0 V 520"/>
  </g>

  <!-- Glow Accents -->
  <circle cx="650" cy="120" r="140" fill="#62e6ff" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="400" r="130" fill="#a855f7" opacity="0.07" filter="blur(50px)"/>

  <!-- Browser / System Window Mockup -->
  <rect x="50" y="45" width="700" height="430" rx="16" fill="#0f1623" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadowBox)"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="700" height="42" rx="16" fill="#141d2d"/>
  <rect x="50" y="72" width="700" height="15" fill="#141d2d"/>

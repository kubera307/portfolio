  <line x1="210" y1="88" x2="210" y2="475" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="75" y="125" fill="#62e6ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">❖ CIE PORTAL</text>
  <rect x="65" y="145" width="130" height="30" rx="8" fill="rgba(98,230,255,0.12)" stroke="#62e6ff" stroke-width="1"/>
  <text x="85" y="165" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">📊 Duty Roster</text>

